<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work Out Log</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap');

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: #0E1116; }

.book-root {
  --bg: #0E1116;
  --panel: #161B22;
  --panel-2: #1C222B;
  --paper: #F4F1E8;
  --text: #E7E5DD;
  --text-dim: #8A93A0;
  --yellow: #F3C64A;
  --gain: #4FB477;
  --load: #E15C4F;
  --rule: #262C36;
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  padding: 18px 16px 90px;
  max-width: 480px;
  margin: 0 auto;
  position: relative;
}
.book-root h1, .book-root h2, .book-root h3 { font-family: 'Sora', sans-serif; margin: 0; }
.book-root .mono { font-variant-numeric: tabular-nums; }

.bk-title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.bk-title { font-size: 22px; font-weight: 800; color: var(--paper); letter-spacing: -0.01em; }
.bk-title-tag { font-size: 11px; color: var(--text-dim); font-weight: 500; margin-top: 2px; }

.bk-guide { background: var(--panel); border: 1px solid var(--yellow); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
.bk-guide h3 { color: var(--paper); font-size: 16px; margin-bottom: 10px; }
.bk-guide ol { margin: 0; padding-left: 18px; color: var(--text); font-size: 13px; line-height: 1.9; }
.bk-guide ol b { color: var(--yellow); }
.bk-guide .bk-dismiss { margin-top: 10px; }

.bk-strip { display: flex; gap: 6px; margin: 4px 0 8px; }
.bk-day { flex: 1; text-align: center; cursor: pointer; user-select: none; }
.bk-day-label { font-size: 11px; color: var(--text-dim); font-weight: 600; margin-bottom: 6px; }
.bk-day-pill { height: 52px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--panel); border: 1px solid var(--rule); font-size: 13px; font-weight: 700; color: var(--text); gap: 4px; transition: transform .12s; }
.bk-day-pill:active { transform: scale(0.93); }
.bk-day-pill.today { background: var(--yellow); color: #14161A; border-color: var(--yellow); }
.bk-dot-ind { width: 5px; height: 5px; border-radius: 50%; }
.bk-t-lift .bk-dot-ind { background: var(--paper); }
.bk-t-tennis .bk-dot-ind { background: var(--yellow); }
.bk-t-both .bk-dot-ind { background: #C77DFF; }
.bk-t-hiit .bk-dot-ind { background: var(--load); }
.bk-t-rest .bk-dot-ind { background: transparent; }
.bk-day-pill.today .bk-dot-ind { background: #14161A; }

.bk-legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 10.5px; color: var(--text-dim); margin-bottom: 18px; }
.bk-legend span { display: inline-flex; align-items: center; gap: 5px; }
.bk-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

.bk-panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
.bk-panel-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; gap: 10px; }
.bk-panel-title { font-size: 20px; font-weight: 800; color: var(--paper); letter-spacing: -0.01em; }
.bk-flag { font-size: 10px; color: var(--load); background: rgba(225,92,79,0.12); border: 1px solid rgba(225,92,79,0.35); padding: 3px 9px; border-radius: 20px; white-space: nowrap; font-weight: 600; }

.bk-genbtn { width: 100%; background: var(--panel-2); border: 1px solid var(--rule); color: var(--yellow); border-radius: 12px; padding: 12px; font-weight: 700; font-size: 13.5px; cursor: pointer; margin-bottom: 14px; }
.bk-genbtn:active { opacity: 0.8; }

.bk-ex { border-top: 1px solid var(--rule); padding: 14px 0; }
.bk-ex:first-of-type { border-top: none; padding-top: 4px; }
.bk-ex-card { display: flex; gap: 10px; margin-bottom: 10px; }
.bk-ex-thumb { width: 52px; height: 52px; border-radius: 10px; object-fit: cover; flex-shrink: 0; background: var(--panel-2); }
.bk-ex-thumb-fallback { width: 52px; height: 52px; border-radius: 10px; flex-shrink: 0; background: var(--panel-2); display: flex; align-items: center; justify-content: center; font-size: 20px; }
.bk-ex-head { flex: 1; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.bk-ex-name { font-size: 15px; font-weight: 700; color: var(--text); }
.bk-ex-cat { font-size: 10.5px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; margin-top: 2px; }
.bk-ex-target { font-size: 11.5px; color: var(--text-dim); white-space: nowrap; font-weight: 600; margin-top: 2px; }
.bk-ex-note { font-size: 11.5px; color: var(--yellow); margin: 0 0 8px; font-weight: 600; }
.bk-ex-note.catchup { color: var(--load); }
.bk-ex-actions { display: flex; gap: 8px; margin-top: 8px; }
.bk-link { font-size: 11.5px; font-weight: 700; color: var(--yellow); background: none; border: none; cursor: pointer; padding: 0; }
.bk-link.dim { color: var(--text-dim); }

.bk-sets { display: flex; flex-direction: column; gap: 6px; }
.bk-set-row { display: grid; grid-template-columns: 20px 1fr 1fr 30px; gap: 8px; align-items: center; }
.bk-set-idx { font-size: 11px; color: var(--text-dim); font-weight: 700; }
.bk-set-row input { background: var(--panel-2); border: 1px solid var(--rule); color: var(--text); border-radius: 8px; padding: 8px; font-size: 13.5px; width: 100%; font-weight: 600; }
.bk-set-row input::placeholder { color: #4E5763; font-weight: 400; }
.bk-set-row input:focus { outline: none; border-color: var(--yellow); }
.bk-set-check { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--rule); background: var(--panel-2); color: var(--gain); font-size: 15px; cursor: pointer; font-weight: 800; }
.bk-set-check.done { background: rgba(79,180,119,0.18); border-color: var(--gain); }

.bk-picker { background: var(--panel-2); border-radius: 12px; padding: 10px; margin-top: 8px; }
.bk-picker-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 4px; font-size: 13px; font-weight: 600; border-bottom: 1px solid var(--rule); cursor: pointer; }
.bk-picker-item:last-child { border-bottom: none; }
.bk-picker-item:active { opacity: 0.7; }
.bk-picker-item span.mono { color: var(--text-dim); font-size: 11px; font-weight: 500; }

.bk-comment { width: 100%; background: var(--panel-2); border: 1px solid var(--rule); color: var(--text); border-radius: 12px; padding: 12px; font-family: 'Inter', sans-serif; font-size: 13px; resize: vertical; min-height: 44px; margin: 4px 0 10px; }
.bk-comment:focus { outline: none; border-color: var(--yellow); }
.bk-hist-comment { font-size: 12px; color: var(--paper); margin-top: 5px; font-style: italic; }

.bk-cta { width: 100%; background: var(--yellow); color: #14161A; border: none; border-radius: 14px; padding: 16px; font-family: 'Sora', sans-serif; font-weight: 800; font-size: 15px; letter-spacing: 0.02em; cursor: pointer; text-transform: uppercase; }
.bk-cta:active { opacity: 0.85; }
.bk-btn { background: var(--paper); color: var(--bg); border: none; border-radius: 10px; padding: 11px; font-weight: 700; font-size: 13px; cursor: pointer; width: 100%; margin-top: 6px; }
.bk-btn.ghost { background: transparent; color: var(--text-dim); border: 1px solid var(--rule); }

.bk-navbar { position: fixed; bottom: 0; left: 0; right: 0; background: #12161D; border-top: 1px solid var(--rule); display: flex; padding: 8px 6px calc(8px + env(safe-area-inset-bottom)); max-width: 480px; margin: 0 auto; z-index: 50; }
.bk-navitem { flex: 1; text-align: center; padding: 4px 2px; cursor: pointer; color: var(--text-dim); }
.bk-navitem.active { color: var(--yellow); }
.bk-navicon { font-size: 18px; display: block; margin-bottom: 2px; }
.bk-navlabel { font-size: 10px; font-weight: 700; }

.bk-hist-item { border-top: 1px solid var(--rule); padding: 12px 0; }
.bk-hist-item:first-child { border-top: none; }
.bk-hist-date { font-size: 11.5px; color: var(--yellow); font-weight: 700; }
.bk-hist-ex { font-size: 12.5px; color: var(--text-dim); margin-top: 4px; line-height: 1.6; }

.bk-empty { text-align: center; color: var(--text-dim); font-size: 13px; padding: 26px 10px; line-height: 1.7; }
.bk-field { margin-bottom: 12px; }
.bk-field label { display: block; font-size: 11px; color: var(--text-dim); font-weight: 700; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.05em; }
.bk-field select, .bk-field input[type=text], .bk-field input[type=password] { width: 100%; background: var(--panel-2); border: 1px solid var(--rule); color: var(--text); border-radius: 10px; padding: 10px; font-size: 13.5px; font-weight: 600; }
.bk-field input::placeholder { color: #55606E; font-weight: 400; }

.bk-lib-cat { margin-bottom: 20px; }
.bk-lib-cat-title { font-size: 12px; color: var(--yellow); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; font-weight: 800; }
.bk-lib-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--rule); }
.bk-lib-item:first-child { border-top: none; }
.bk-lib-name { font-size: 14px; font-weight: 700; }
.bk-lib-meta { font-size: 11px; color: var(--text-dim); margin-top: 2px; font-weight: 500; }
.bk-add-btn { background: var(--panel-2); border: 1px solid var(--rule); color: var(--gain); border-radius: 8px; padding: 6px 12px; font-size: 11px; font-weight: 800; cursor: pointer; white-space: nowrap; margin-left: auto; }
.bk-add-btn:active { opacity: 0.7; }

.bk-loading { text-align: center; color: var(--text-dim); font-size: 13px; padding: 40px 0; }
</style>
</head>

  async function load(){
    try { const s = await window.storage.get('settings'); if (s) state.settings = Object.assign(state.settings, JSON.parse(s.value)); } catch(e){}

    try { const s = await window.storage.get('sessions'); if (s) state.sessions = JSON.parse(s.value); } catch(e){}

  async function saveSettings(){ try { await window.storage.set('settings', JSON.stringify(state.settings)); } catch(e){} }
  async function saveWeekTypes(){ try { await window.storage.set('week-types', JSON.stringify(state.weekTypes)); } catch(e){} }
  async function saveSessions(){ try { await window.storage.set('sessions', JSON.stringify(state.sessions)); } catch(e){} }

  function ghConfigured(){ const g = state.settings; return !!(g.ghOwner && g.ghRepo && g.ghPath && g.ghToken); }
  function ghHeaders(){ return { 'Authorization': 'token ' + state.settings.ghToken, 'Accept': 'application/vnd.github+json' }; }
  function ghUrl(){ const g = state.settings; return `https://api.github.com/repos/${encodeURIComponent(g.ghOwner)}/${encodeURIComponent(g.ghRepo)}/contents/${g.ghPath}`; }
  function b64encode(str){ return btoa(unescape(encodeURIComponent(str))); }
  function b64decode(b64){ return decodeURIComponent(escape(atob(b64.replace(/\n/g,'')))); }

  async function ghPull(silent){
    if (!ghConfigured()) return false;
    ghBusy = true; if (!silent) render();
    try {
      const res = await fetch(ghUrl(), { headers: ghHeaders() });
      if (res.status === 404) { ghStatus = 'No file yet — will create on first sync'; ghBusy = false; return false; }
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const file = await res.json();
      ghSha = file.sha;
      const data = JSON.parse(b64decode(file.content));
      if (data.sessions) state.sessions = data.sessions;
      if (data.weekTypes) state.weekTypes = data.weekTypes;
      if (data.settingsCore) Object.assign(state.settings, data.settingsCore);
      await saveSessions(); await saveWeekTypes(); await saveSettings();
      ghStatus = 'Pulled latest at ' + new Date().toLocaleTimeString();
      return true;
    } catch(e){ ghStatus = 'Pull failed: ' + e.message; return false; }
    finally { ghBusy = false; if (!silent) render(); }
  }

  async function ghPush(){
    if (!ghConfigured()) return;
    ghBusy = true; render();
    try {
      const payload = {
        sessions: state.sessions, weekTypes: state.weekTypes,
        settingsCore: { fasting: state.settings.fasting, lastTemplateIdx: state.settings.lastTemplateIdx, guideDismissed: state.settings.guideDismissed },
        updatedAt: new Date().toISOString()
      };
      const body = { message: 'Update training log — ' + todayStr(), content: b64encode(JSON.stringify(payload, null, 2)) };
      if (ghSha) body.sha = ghSha;
      const res = await fetch(ghUrl(), { method: 'PUT', headers: Object.assign({'Content-Type':'application/json'}, ghHeaders()), body: JSON.stringify(body) });
      if (!res.ok){
        const err = await res.json().catch(()=>({}));
        if (res.status === 409 || /sha/i.test(err.message||'')){
          const r2 = await fetch(ghUrl(), { headers: ghHeaders() });
          if (r2.ok){ const f2 = await r2.json(); ghSha = f2.sha; return ghPush(); }
        }
        throw new Error(err.message || ('HTTP ' + res.status));
      }
      const json = await res.json();
      ghSha = json.content.sha;
      ghStatus = 'Synced at ' + new Date().toLocaleTimeString();
    } catch(e){ ghStatus = 'Sync failed: ' + e.message; }
    finally { ghBusy = false; render(); }
  }

  function nextTemplateKey(){ return ORDER[(state.settings.lastTemplateIdx + 1) % 3]; }

  function tennisLoadFlag(){
    const t = todayStr();
    const y = todayStr(new Date(Date.now()-86400000));
    const tt = state.weekTypes[t], ty = state.weekTypes[y];
    return tt === 'tennis' || tt === 'both' || ty === 'tennis' || ty === 'both';

  function lastSessionFor(exName){
    for (let i = state.sessions.length-1; i>=0; i--){
      const ex = state.sessions[i].exercises.find(e=>e.name===exName);
      if (ex) return ex;
    }
    return null;
  }

  function suggestWeight(ex){
    const last = lastSessionFor(ex.name);
    if (!last || ex.bodyweight) return ex.start;
    const validSets = last.sets.filter(s=>s.weight!=null);
    if (!validSets.length) return ex.start;
    const hitAll = validSets.every(s => (s.reps||0) >= ex.reps);
    const lastWeight = Math.max(...validSets.map(s=>s.weight||0));
    if (!lastWeight) return ex.start;
    if (hitAll) return Math.round((lastWeight + (ex.unit==='kg'?2.5:5))*2)/2;
    return lastWeight;
  }

  function categoriesInSession(s){
    return new Set(s.exercises.filter(ex => ex.sets.some(st => st.weight!=null || st.reps!=null)).map(ex => ex.cat));
  }
  function daysSinceCategory(cat){
    for (let i = state.sessions.length-1; i>=0; i--){
      const s = state.sessions[i];
      if (categoriesInSession(s).has(cat)) return Math.round((new Date(todayStr()) - new Date(s.date)) / 86400000);
    }
    return null;
  }

  function findLibEx(name){
    for (const cat in EXLIB){ const f = EXLIB[cat].find(e=>e.name===name); if (f) return f; }

  function makeSessionExercise(tplEx, trimIfLoaded){
    let numSets = tplEx.sets;
    let note = null;
    if (trimIfLoaded && !tplEx.bodyweight && tplEx.cat !== 'tennis' && tplEx.cat !== 'core'){
      numSets = Math.max(2, tplEx.sets - 1);
      note = 'Trimmed a set — tennis load';
    }
    const lib = findLibEx(tplEx.name);
    return {
      name: tplEx.name, unit: tplEx.unit, cat: tplEx.cat, targetReps: tplEx.reps, note, catchup: false,
      suggested: suggestWeight(tplEx), isExtra: false, img: lib && lib.img || null,
      sets: Array.from({length: numSets}, () => ({ reps: null, weight: null, done: false }))
    };
  }

    const exercises = tpl.exercises.map(e => makeSessionExercise(e, reduceLoad));

    const presentCats = new Set(exercises.map(e => e.cat));
    MAIN_CATS.forEach(cat => {
      if (presentCats.has(cat)) return;
      const days = daysSinceCategory(cat);
      if (days !== null && days >= 6){
        const lib = EXLIB[cat][0];
        if (lib){
          exercises.push({
            name: lib.name, unit: lib.unit, cat, targetReps: lib.reps,
            note: `Catch-up — ${days}d since last ${CATS[cat]}`, catchup: true, isExtra: true,
            suggested: suggestWeight(lib), img: lib.img || null,
            sets: Array.from({length: Math.max(2, lib.sets-1)}, () => ({ reps: null, weight: null, done: false }))
          });
        }
      }
    });

    return { date: todayStr(), template: key, label: tpl.label, tennisFlag: reduceLoad, comment: '', exercises };
  }

  function ensureActive(){
    if (!state.active || state.active.date !== todayStr()){
      state.active = buildActiveSession();
    }
  }

  async function generateWorkout(){
    ensureActive();
    genBusy = true; genError = null; render();
    try {
      const history = state.sessions.slice(-12).map(s => ({
        date: s.date, label: s.label, tennisFlag: s.tennisFlag, comment: s.comment || undefined,
        exercises: s.exercises.map(ex => ({
          name: ex.name, cat: ex.cat, unit: ex.unit, targetReps: ex.targetReps,
          sets: ex.sets.filter(st => st.weight != null || st.reps != null).map(st => ({ reps: st.reps, weight: st.weight }))
        }))
      }));
      const week = weekDates().map(d => ({ date: todayStr(d), type: state.weekTypes[todayStr(d)] || 'rest' }));
      const todayType = state.weekTypes[todayStr()] || 'rest';

      const prompt = `You are a strength coach programming today's session for an athlete who also plays competitive tennis and follows ${state.settings.fasting} intermittent fasting.

Training history, most recent last (JSON): ${JSON.stringify(history)}

This week's day types: ${JSON.stringify(week)}
Today's day type: ${todayType} (note: "both" means tennis and lifting happen the same day)

Rules:
- Full-body session, 4-6 exercises, drawn from these body-part categories: legs, glutes, back, chest, shoulders, arms, core, tennis (rotational/shoulder-health accessory work).
- Progress the weight on any lift where the last logged sets all met or beat target reps; hold weight if they didn't; use a sensible starting weight if there's no history for it.
- If a body part hasn't appeared in a logged session in 6+ days, include it today and say so in that exercise's note.
- If today's type is "tennis" or "both", or tennis happened yesterday, trim volume on heavy lower-body/compound lifts by roughly one set and note it.
- Read any comments in the history (soreness, missed sessions, how it felt) and adjust today's choices accordingly — explain your reasoning briefly in "rationale".
- Units: kg for loaded lifts, "reps" for bodyweight movements, "sec" for timed holds.

Respond with ONLY valid JSON, no markdown fences, no commentary, in this exact shape:
{"label":"string","rationale":"1-2 sentences","tennisFlag":boolean,"exercises":[{"name":"string","cat":"legs|glutes|back|chest|shoulders|arms|core|tennis","unit":"kg|reps|sec","sets":number,"targetReps":number,"suggestedWeight":number,"note":"string or empty"}]}`;

      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 1200, messages: [{ role: "user", content: prompt }] })
      });
      const data = await res.json();
      const textBlock = (data.content || []).find(b => b.type === 'text');
      if (!textBlock) throw new Error('no response text');
      const clean = textBlock.text.replace(/```json|```/g, '').trim();
      const parsed = JSON.parse(clean);
      if (!parsed.exercises || !parsed.exercises.length) throw new Error('empty plan returned');

      state.active.label = parsed.label || state.active.label;
      state.active.tennisFlag = !!parsed.tennisFlag;
      state.active.rationale = parsed.rationale || '';
      state.active.generated = true;
      state.active.exercises = parsed.exercises.map(e => {
        const lib = findLibEx(e.name);
        return {
          name: e.name, unit: e.unit || 'kg', cat: e.cat || 'core', targetReps: e.targetReps || 10,
          note: e.note || null, catchup: false, isExtra: true, img: lib && lib.img || null,
          suggested: e.suggestedWeight != null ? e.suggestedWeight : 0,
          sets: Array.from({ length: Math.max(1, e.sets || 3) }, () => ({ reps: null, weight: null, done: false }))
        };
      });
    } catch(err){
      genError = 'Generate failed — ' + err.message + '. Kept your current session.';
    } finally { genBusy = false; render(); }
  }

  async function logSession(){
    const s = state.active;
    state.sessions.push(s);
    state.settings.lastTemplateIdx = ORDER.indexOf(s.template);
    await saveSessions(); await saveSettings();
    state.active = null;
    render();
    if (ghConfigured()) ghPush();
  }

  function cycleDayType(dateStr){
    const cur = state.weekTypes[dateStr] || 'rest';
    state.weekTypes[dateStr] = DAY_TYPE_ORDER[(DAY_TYPE_ORDER.indexOf(cur)+1) % DAY_TYPE_ORDER.length];
    saveWeekTypes();
    render();
    if (ghConfigured()) ghPush();
  }

  function fmtSets(ex){
    return ex.sets.filter(s=>s.weight!=null || s.reps!=null).map(s => `${s.reps||'-'}×${s.weight??'-'}${ex.unit==='sec'?'s':(ex.unit==='reps'?'':ex.unit)}`).join(', ') || '—';
  }

  function swapExercise(ei, libEx){
    const cur = state.active.exercises[ei];
    state.active.exercises[ei] = {
      name: libEx.name, unit: libEx.unit, cat: cur.cat, targetReps: libEx.reps, note: cur.note, isExtra: cur.isExtra, img: libEx.img || null,
      suggested: suggestWeight(libEx),
      sets: Array.from({length: cur.sets.length}, () => ({ reps: null, weight: null, done: false }))
    };
    openPicker = null;
    render();
  }
  function addFromLibrary(libEx, cat){
    state.active.exercises.push({
      name: libEx.name, unit: libEx.unit, cat, targetReps: libEx.reps, note: null, isExtra: true, img: libEx.img || null,
      suggested: suggestWeight(libEx),
      sets: Array.from({length: libEx.sets}, () => ({ reps: null, weight: null, done: false }))
    });
    render();
  }
  function removeExercise(ei){ state.active.exercises.splice(ei,1); render(); }

  function render(){
    ensureActive();
    const week = weekDates();
    const tstr = todayStr();
    const hasAnySession = state.sessions.length > 0;

    let stripHtml = week.map(d => {
      const ds = todayStr(d);
      const type = state.weekTypes[ds] || 'rest';
      const isToday = ds === tstr;
      return `<div class="bk-day" onclick="bkCycle('${ds}')">
        <div class="bk-day-label">${DAYS[d.getDay()]}</div>
        <div class="bk-day-pill bk-t-${type} ${isToday?'today':''}">
          <span>${d.getDate()}</span>
          <span class="bk-dot-ind"></span>
        </div>
      </div>`;
    }).join('');

    let guideHtml = '';
    if (!state.settings.guideDismissed){
      guideHtml = `<div class="bk-guide">
        <h3>How this works</h3>
        <ol>
          <li><b>Tap the strip</b> to cycle each day: Rest → Lift → Tennis → Tennis + Lift → HIIT.</li>
          <li><b>Today</b> proposes a full-body session. Hit <b>⚡ Generate from my log</b> for a plan built from your real history.</li>
          <li>Enter <b>weight</b> and <b>reps</b> per set, tap ✓, then <b>Log Session</b>.</li>
          <li><b>Swap</b> any exercise, or add extras from the <b>Library</b> tab — grouped by body part.</li>
          <li>Missed a session? The next one pulls back in any body part you haven't hit in 6+ days.</li>
          <li>Connect <b>GitHub sync</b> in Settings so your log can be read from a chat, not just here.</li>
        </ol>
        <button class="bk-btn ghost bk-dismiss" onclick="bkDismissGuide()">Got it, hide this</button>
      </div>`;
    }

    let body = '';
    if (tab === 'today'){
      const s = state.active;
      const alreadyLogged = state.sessions.some(x=>x.date===tstr);
      if (alreadyLogged){
        body = `<div class="bk-panel"><div class="bk-empty">Session logged for today. Nice work.<br><span style="color:var(--yellow);font-weight:700;">Next: ${TEMPLATES[nextTemplateKey()].label}</span></div></div>`;
      } else {
        body = `<div class="bk-panel">
          <div class="bk-panel-head">
            <div class="bk-panel-title">${s.label}</div>
            ${s.tennisFlag ? '<div class="bk-flag">tennis load</div>' : ''}
          </div>
          <div class="bk-title-tag" style="margin-bottom:14px;">${s.generated ? (s.rationale || 'Generated from your training log.') : `Full-body, position ${s.template} in rotation`}</div>
          <button class="bk-genbtn" ${genBusy?'disabled':''} onclick="bkGenerate()">${genBusy ? 'Reviewing your log…' : (s.generated ? '⚡ Regenerate' : '⚡ Generate from my log')}</button>
          ${genError ? `<div class="bk-ex-note" style="margin-bottom:10px;">${genError}</div>` : ''}
          ${s.exercises.map((ex,ei) => `
            <div class="bk-ex">
              <div class="bk-ex-card">
                ${ex.img ? `<img class="bk-ex-thumb" src="${ex.img}" onerror="this.outerHTML='<div class=&quot;bk-ex-thumb-fallback&quot;>${CAT_ICON[ex.cat]||'🏋️'}</div>'" />` : `<div class="bk-ex-thumb-fallback">${CAT_ICON[ex.cat]||'🏋️'}</div>`}
                <div class="bk-ex-head">
                  <div>
                    <div class="bk-ex-name">${ex.name}</div>
                    <div class="bk-ex-cat">${CATS[ex.cat]||''}</div>
                  </div>
                  <div class="bk-ex-target mono">${ex.sets.length}×${ex.targetReps}<br>@ ${ex.suggested}${ex.unit==='sec'?'s':(ex.unit==='reps'?'':ex.unit)}</div>
                </div>
              </div>
              ${ex.note ? `<div class="bk-ex-note ${ex.catchup?'catchup':''}">${ex.note}</div>` : ''}
              <div class="bk-sets">
                ${ex.sets.map((st,si) => `
                  <div class="bk-set-row">
                    <div class="bk-set-idx">${si+1}</div>
                    <input type="number" inputmode="decimal" placeholder="${ex.unit==='sec'?'sec':(ex.unit==='reps'?'—':ex.unit)}" value="${st.weight??''}" onchange="bkSetVal(${ei},${si},'weight',this.value)" />
                    <input type="number" inputmode="numeric" placeholder="reps" value="${st.reps??''}" onchange="bkSetVal(${ei},${si},'reps',this.value)" />
                    <button class="bk-set-check ${st.done?'done':''}" onclick="bkToggleDone(${ei},${si})">${st.done?'✓':''}</button>
                  </div>
                `).join('')}
              </div>
              <div class="bk-ex-actions">
                <button class="bk-link" onclick="bkOpenPicker(${ei})">swap</button>
                ${ex.isExtra ? `<button class="bk-link dim" onclick="bkRemoveEx(${ei})">remove</button>` : ''}
              </div>
              ${openPicker === ei ? `
                <div class="bk-picker">
                  ${(EXLIB[ex.cat]||[]).map(le => `
                    <div class="bk-picker-item" onclick="bkSwap(${ei}, ${JSON.stringify(le.name).replace(/"/g,'&quot;')})">
                      <span>${le.name}</span><span class="mono">${le.sets}×${le.reps}</span>
                    </div>
                  `).join('')}
                </div>
              ` : ''}
            </div>
          `).join('')}
          <button class="bk-btn ghost" onclick="bkTab('library')">+ Add exercise from library</button>
          <textarea class="bk-comment" placeholder="Comment on today (how it felt, soreness, why you cut it short...)" oninput="bkComment(this.value)">${s.comment||''}</textarea>
          <button class="bk-cta" onclick="bkLog()">Log Session</button>
        </div>`;
      }
    } else if (tab === 'library'){
      body = `<div class="bk-panel">
        <div class="bk-title-tag" style="margin-bottom:14px;">Grouped by body part. Tap <span style="color:var(--gain);font-weight:700;">add</span> to drop it into today's session.</div>
        ${Object.keys(EXLIB).map(cat => `
          <div class="bk-lib-cat">
            <div class="bk-lib-cat-title">${CAT_ICON[cat]} ${CATS[cat]}</div>
            ${EXLIB[cat].map(le => `
              <div class="bk-lib-item">
                ${le.img ? `<img class="bk-ex-thumb" src="${le.img}" onerror="this.outerHTML='<div class=&quot;bk-ex-thumb-fallback&quot;>${CAT_ICON[cat]}</div>'" />` : `<div class="bk-ex-thumb-fallback">${CAT_ICON[cat]}</div>`}
                <div>
                  <div class="bk-lib-name">${le.name}</div>
                  <div class="bk-lib-meta">${le.sets}×${le.reps}${le.bodyweight ? ' · bodyweight' : ' · start ' + le.start + le.unit}</div>
                </div>
                <button class="bk-add-btn" onclick="bkAddLib('${cat}', ${JSON.stringify(le.name).replace(/"/g,'&quot;')})">add</button>
              </div>
            `).join('')}
          </div>
        `).join('')}
      </div>`;
    } else if (tab === 'progress'){
      if (!hasAnySession){
        body = `<div class="bk-panel"><div class="bk-empty">No sessions logged yet. Log your first one from the Workout tab and it'll show up here.</div></div>`;
      } else {
        const rev = [...state.sessions].reverse().slice(0,20);
        body = `<div class="bk-panel">${rev.map(s => `
          <div class="bk-hist-item">
            <div class="bk-hist-date">${s.date} · ${s.label}${s.tennisFlag?' · tennis load':''}</div>
            <div class="bk-hist-ex">${s.exercises.map(ex=>`${ex.name}: ${fmtSets(ex)}`).join('<br>')}</div>
            ${s.comment ? `<div class="bk-hist-comment">"${s.comment}"</div>` : ''}
          </div>
        `).join('')}</div>`;
      }
    } else if (tab === 'settings'){
      const g = state.settings;
      body = `<div class="bk-panel">
        <div class="bk-field">
          <label>Fasting protocol</label>
          <select onchange="bkSetting('fasting', this.value)">
            ${['16:8','18:6','none'].map(o=>`<option value="${o}" ${state.settings.fasting===o?'selected':''}>${o}</option>`).join('')}
          </select>
        </div>
        <div class="bk-title-tag">Tap a day on the strip to cycle its type. The next session auto-trims volume around tennis and catches up any missed body part.</div>
        <button class="bk-btn ghost" style="margin-top:16px;" onclick="bkShowGuide()">Show instructions again</button>
        <button class="bk-btn ghost" style="margin-top:8px;" onclick="bkReset()">Reset all data</button>
      </div>

      <div class="bk-panel">
        <div class="bk-panel-title" style="font-size:16px;margin-bottom:6px;">GitHub sync</div>
        <div class="bk-title-tag" style="margin-bottom:14px;">Your log gets written to a JSON file in a repo, so it can be read from a chat too.</div>
        <div class="bk-field"><label>GitHub username / org</label><input type="text" value="${g.ghOwner}" placeholder="e.g. mani" onchange="bkSetting('ghOwner', this.value.trim())" /></div>
        <div class="bk-field"><label>Repo name</label><input type="text" value="${g.ghRepo}" placeholder="e.g. GET-FIT-" onchange="bkSetting('ghRepo', this.value.trim())" /></div>
        <div class="bk-field"><label>File path in repo</label><input type="text" value="${g.ghPath}" onchange="bkSetting('ghPath', this.value.trim())" /></div>
        <div class="bk-field"><label>Personal access token</label><input type="password" value="${g.ghToken}" placeholder="repo-scoped token" onchange="bkSetting('ghToken', this.value.trim())" /></div>
        <div class="bk-title-tag" style="margin-bottom:10px;">${ghBusy ? 'Working…' : ghStatus}</div>
        <button class="bk-btn ghost" ${ghBusy?'disabled':''} onclick="bkGhPull()">Pull latest from GitHub</button>
        <button class="bk-btn" ${ghBusy?'disabled':''} onclick="bkGhPush()">Sync now</button>
      </div>`;
    }

    const NAV = [
      { id: 'today', icon: '🏋️', label: 'Workout' },
      { id: 'library', icon: '📚', label: 'Library' },
      { id: 'progress', icon: '📈', label: 'Progress' },
      { id: 'settings', icon: '⚙️', label: 'Settings' },
    ];

    root.innerHTML = `
      <div class="bk-title-row">
        <div>
          <div class="bk-title">Work Out Log</div>
          <div class="bk-title-tag">${state.settings.fasting} · built around your tennis week</div>
        </div>
      </div>
      ${guideHtml}
      <div class="bk-strip">${stripHtml}</div>
      <div class="bk-legend">
        <span><span class="bk-dot" style="background:var(--paper)"></span>Lift</span>
        <span><span class="bk-dot" style="background:var(--yellow)"></span>Tennis</span>
        <span><span class="bk-dot" style="background:#C77DFF"></span>Tennis+Lift</span>
        <span><span class="bk-dot" style="background:var(--load)"></span>HIIT</span>
        <span><span class="bk-dot" style="background:var(--panel-2);border:1px solid var(--rule)"></span>Rest</span>
      </div>
      ${body}
      <div class="bk-navbar">
        ${NAV.map(n => `<div class="bk-navitem ${tab===n.id?'active':''}" onclick="bkTab('${n.id}')"><span class="bk-navicon">${n.icon}</span><span class="bk-navlabel">${n.label}</span></div>`).join('')}
      </div>
    `;
  }

  window.bkCycle = cycleDayType;
  window.bkTab = (t) => { tab = t; openPicker = null; render(); };
  window.bkSetVal = (ei, si, field, val) => {
    const v = val === '' ? null : Number(val);
    state.active.exercises[ei].sets[si][field] = v;
  };
  window.bkToggleDone = (ei, si) => { state.active.exercises[ei].sets[si].done = !state.active.exercises[ei].sets[si].done; render(); };
  window.bkOpenPicker = (ei) => { openPicker = (openPicker === ei) ? null : ei; render(); };
  window.bkGenerate = generateWorkout;
  window.bkComment = (val) => { state.active.comment = val; };
  window.bkSwap = (ei, name) => {
    const cat = state.active.exercises[ei].cat;
    const libEx = (EXLIB[cat]||[]).find(e=>e.name===name);
    if (libEx) swapExercise(ei, libEx);
  };
  window.bkAddLib = (cat, name) => {
    const libEx = (EXLIB[cat]||[]).find(e=>e.name===name);
    if (libEx) { addFromLibrary(libEx, cat); tab='today'; render(); }
  };
  window.bkRemoveEx = removeExercise;
  window.bkLog = logSession;
  window.bkSetting = (k, v) => { state.settings[k] = v; saveSettings(); render(); };
  window.bkGhPull = () => ghPull(false);
  window.bkGhPush = () => ghPush();
  window.bkDismissGuide = () => { state.settings.guideDismissed = true; saveSettings(); render(); };
  window.bkShowGuide = () => { state.settings.guideDismissed = false; saveSettings(); tab='today'; render(); };
  window.bkReset = async () => {
    if (!confirm('Clear all logged sessions and settings?')) return;
    try {
      await window.storage.set('settings', JSON.stringify({fasting:'16:8', lastTemplateIdx:-1, guideDismissed:false, ghOwner:'', ghRepo:'', ghPath:'data/workout-book.json', ghToken:''}));
      await window.storage.set('week-types', JSON.stringify({}));
      await window.storage.set('sessions', JSON.stringify([]));
    } catch(e){}
    location.reload();
  };

  load();
})();
</script>
</body>
</html>
